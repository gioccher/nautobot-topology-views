[tool.poetry]
name = "nautobot-topology-views"
version = "4.5.1.4"
description = "A Nautobot App to create Topology maps"
readme = "README.md"
authors = ["@mattieserver", "netbox-community", "@gioccher"]
license = "Apache-2.0"
homepage = "https://github.com/gioccher/nautobot-topology-views"
repository = "https://github.com/gioccher/nautobot-topology-views"
keywords = ["nautobot", "nautobot-app", "topology"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
]
packages = [
    { include = "nautobot_topology_views" },
]
include = [
    "nautobot_topology_views/static/**/*",
    "nautobot_topology_views/templates/**/*",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
nautobot = "^3.2.7"

[tool.poetry.group.dev.dependencies]
ruff = "^0.15.0"
pytest = "^9.0.0"
pytest-django = "^4.12.0"
invoke = "^3.0.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [ "D", "CPY", "ANN", "TD", "F401", "W293", "FA100" ]
preview = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nautobot.core.tests.nautobot_config"
python_files = ["test_*.py", "*_test.py"]
