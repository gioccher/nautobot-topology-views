<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Virtual machine: a host tray with two guest windows stacked above it.
     Drawn for the KUNet fork in the same palette and stroke weight as the
     other icons (white disc, #9cc8f8 rim, #1685fc strokes). -->
<svg width="35.465557mm" height="35.465557mm" viewBox="0 0 35.465557 35.465557" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <circle cx="17.732778" cy="17.732778" r="17.0" style="fill:#ffffff;fill-opacity:1;stroke:#9cc8f8;stroke-width:1.32292;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1" />
  <g style="fill:none;stroke:#1685fc;stroke-width:1.323;stroke-linecap:butt;stroke-linejoin:miter;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1">
    <!-- host tray -->
    <rect x="8.0" y="22.5" width="19.465557" height="4.2" rx="0.8" ry="0.8" />
    <circle cx="11.0" cy="24.6" r="0.55" style="fill:#1685fc" />
    <circle cx="13.4" cy="24.6" r="0.55" style="fill:#1685fc" />
    <!-- guest windows, the rear one offset up and right -->
    <rect x="12.5" y="7.2" width="13.0" height="9.6" rx="0.8" ry="0.8" />
    <rect x="9.2" y="10.4" width="13.0" height="9.6" rx="0.8" ry="0.8" style="fill:#ffffff" />
    <path d="M 9.2,12.9 H 22.2" />
    <path d="M 12.5,9.7 H 25.5" />
  </g>
</svg>
