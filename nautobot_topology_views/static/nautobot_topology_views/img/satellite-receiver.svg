<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Satellite receiver: a low set-top box with a front display and two buttons,
     a small offset dish with its feed arm above it. Drawn in the same style as
     the existing icons: white disc, #9cc8f8 rim, #1685fc line work at 1.323. -->
<svg width="35.465557mm" height="35.465557mm" viewBox="0 0 35.465557 35.465557" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <circle cx="17.732778" cy="17.732778" r="17.071318" style="fill:#ffffff;fill-opacity:1;stroke:#9cc8f8;stroke-width:1.32292;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1" />
  <g style="fill:none;stroke:#1685fc;stroke-width:1.323;stroke-linecap:round;stroke-linejoin:round;stroke-miterlimit:4;stroke-dasharray:none;stroke-opacity:1">
    <!-- set-top box -->
    <rect x="8.0" y="19.6" width="19.465557" height="6.4" rx="0.9" ry="0.9" />
    <rect x="10.2" y="21.7" width="5.2" height="2.2" rx="0.3" ry="0.3" style="fill:#e3f0fd" />
    <circle cx="22.2" cy="22.8" r="0.6" style="fill:#1685fc" />
    <circle cx="24.6" cy="22.8" r="0.6" style="fill:#1685fc" />
    <!-- dish: an offset reflector, its mast, and the feed arm to the LNB -->
    <path d="M 14.6,16.6 C 12.3,13.6 13.3,9.6 16.8,8.4 C 19.6,7.5 22.5,9.2 23.2,12.0" style="fill:#e3f0fd" />
    <path d="M 14.6,16.6 L 23.2,12.0" />
    <path d="M 18.9,14.3 L 19.6,17.6" />
    <path d="M 18.9,14.3 L 24.4,15.9" />
    <circle cx="24.9" cy="16.1" r="0.85" style="fill:#1685fc" />
  </g>
</svg>
